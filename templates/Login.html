<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Party Quest - 로그인</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0f1a; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; font-family:'Noto Sans KR',sans-serif; position:relative; overflow:hidden; }
  .bg-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(99,102,241,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.07) 1px,transparent 1px); background-size:40px 40px; }
  .bg-glow { position:absolute; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle,rgba(99,102,241,.18) 0%,transparent 70%); top:-80px; right:-60px; pointer-events:none; }
  .bg-glow2 { position:absolute; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle,rgba(20,184,166,.12) 0%,transparent 70%); bottom:-60px; left:-40px; pointer-events:none; }
  .card { position:relative; width:100%; max-width:360px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:24px; padding:36px 32px; }
  .logo-row { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .logo-icon { width:38px; height:38px; background:linear-gradient(135deg,#6366f1,#14b8a6); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .logo-text { font-family:'Black Han Sans',sans-serif; font-size:17px; color:#fff; }
  .logo-sub { font-size:10px; color:rgba(255,255,255,.4); margin-top:1px; letter-spacing:1px; text-transform:uppercase; }
  .tab-row { display:flex; background:rgba(255,255,255,.06); border-radius:10px; padding:3px; margin-bottom:28px; }
  .tab { flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; color:rgba(255,255,255,.4); transition:all .2s; }
  .tab.active { background:rgba(99,102,241,.5); color:#fff; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; color:rgba(255,255,255,.45); margin-bottom:6px; letter-spacing:.8px; text-transform:uppercase; }
  .field input { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:11px 14px; color:#fff; font-size:14px; font-family:'Noto Sans KR',sans-serif; outline:none; transition:border-color .2s; }
  .field input::placeholder { color:rgba(255,255,255,.2); }
  .field input:focus { border-color:rgba(99,102,241,.6); background:rgba(99,102,241,.08); }
  .btn-main { width:100%; padding:13px; background:linear-gradient(135deg,#6366f1,#4f46e5); border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:700; font-family:'Noto Sans KR',sans-serif; cursor:pointer; margin-top:8px; transition:opacity .2s; }
  .btn-main:hover { opacity:.9; }
  .trust-badge { display:flex; align-items:center; gap:8px; background:rgba(20,184,166,.1); border:1px solid rgba(20,184,166,.2); border-radius:10px; padding:10px 12px; margin-top:20px; }
  .trust-dot { width:8px; height:8px; background:#14b8a6; border-radius:50%; flex-shrink:0; }
  .trust-text { font-size:11px; color:rgba(20,184,166,.9); line-height:1.4; }
  .err { color:#f87171; font-size:12px; margin-top:10px; text-align:center; min-height:18px; }
  .panel { display:none; }
  .panel.show { display:block; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>
<div class="card">
  <div class="logo-row">
    <div class="logo-icon">🎮</div>
    <div>
      <div class="logo-text">Campus Party Quest</div>
      <div class="logo-sub">Campus Game Matching</div>
    </div>
  </div>
  <div class="tab-row">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">로그인</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">회원가입</div>
  </div>

  <!-- 로그인 패널 -->
  <div class="panel show" id="panel-login">
    <div class="field">
      <label>아이디</label>
      <input id="login-id" type="text" placeholder="학번 또는 아이디 입력"/>
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input id="login-pw" type="password" placeholder="비밀번호 입력"/>
    </div>
    <button class="btn-main" onclick="doLogin()">로그인</button>
    <div class="err" id="login-err"></div>
    <div class="trust-badge">
      <div class="trust-dot"></div>
      <div class="trust-text">캠퍼스 인증 계정만 이용 가능합니다</div>
    </div>
  </div>

  <!-- 회원가입 패널 -->
  <div class="panel" id="panel-register">
    <div class="field">
      <label>아이디</label>
      <input id="reg-id" type="text" placeholder="사용할 아이디 입력"/>
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input id="reg-pw" type="password" placeholder="비밀번호 입력"/>
    </div>
    <div class="field">
      <label>닉네임</label>
      <input id="reg-nick" type="text" placeholder="게임에서 사용할 닉네임"/>
    </div>
    <button class="btn-main" onclick="doRegister()">회원가입</button>
    <div class="err" id="reg-err"></div>
    <div class="trust-badge">
      <div class="trust-dot"></div>
      <div class="trust-text">가입 시 신뢰도 점수 100점이 부여됩니다</div>
    </div>
  </div>
</div>

<script>
function switchTab(t) {
  ['login','register'].forEach(k => {
    document.getElementById('tab-'+k).classList.toggle('active', k===t);
    document.getElementById('panel-'+k).classList.toggle('show', k===t);
  });
}

async function doLogin() {
  const user_id = document.getElementById('login-id').value.trim();
  const password = document.getElementById('login-pw').value.trim();
  const err = document.getElementById('login-err');
  if (!user_id || !password) { err.textContent = '아이디와 비밀번호를 입력하세요.'; return; }
  const res = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id, password })
  });
  const data = await res.json();
  if (data.success) {
    sessionStorage.setItem('user_id', data.user_id);
    sessionStorage.setItem('username', data.username);
    sessionStorage.setItem('trust_score', data.trust_score);
    location.href = '/list';
  } else {
    err.textContent = data.message;
  }
}

async function doRegister() {
  const user_id = document.getElementById('reg-id').value.trim();
  const password = document.getElementById('reg-pw').value.trim();
  const username = document.getElementById('reg-nick').value.trim();
  const err = document.getElementById('reg-err');
  if (!user_id || !password || !username) { err.textContent = '모든 항목을 입력하세요.'; return; }
  const res = await fetch('/api/register', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id, password, username })
  });
  const data = await res.json();
  if (data.success) {
    sessionStorage.setItem('user_id', data.user_id);
    sessionStorage.setItem('username', data.username);
    sessionStorage.setItem('trust_score', data.trust_score);
    location.href = '/list';
  } else {
    err.textContent = data.message;
  }
}
</script>
</body>
</html>
